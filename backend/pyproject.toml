[project]
name = "solar-sites"
version = "1.0.0"
description = "Backend of the Solar sites assessment (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
# S101: assert is how pytest checks. B008: FastAPI uses calls in defaults (Depends, Query).
# UP017: timezone.utc reads clearer than datetime.UTC.
ignore = ["S101", "B008", "UP017"]
per-file-ignores = { "tests/*" = ["S105", "S106", "S107"] }

[tool.ruff.lint.isort]
known-first-party = ["app"]
